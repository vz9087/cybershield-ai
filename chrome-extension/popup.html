<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberShield AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 340px; font-family: -apple-system, "Segoe UI", sans-serif; background: #0f1418; color: #e6f1ff; font-size: 13px; }
    .header { padding: 14px 16px; border-bottom: 1px solid #1e2c33; display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 20px; }
    .brand { font-weight: 700; font-size: 14px; }
    .brand small { color: #0b99a7; font-weight: 600; font-size: 11px; letter-spacing: 0.1em; }
    .content { padding: 16px; }
    .url { font-size: 11px; color: #8892b0; word-break: break-all; margin-bottom: 12px; padding: 8px; background: #0a192f; border-radius: 6px; }
    .status { text-align: center; padding: 20px 10px; border-radius: 8px; margin-bottom: 12px; }
    .status.low { background: rgba(20, 184, 166, 0.1); border: 1px solid #14b8a6; }
    .status.medium { background: rgba(255, 170, 0, 0.1); border: 1px solid #ffaa00; }
    .status.high { background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; }
    .status.critical { background: rgba(255, 68, 68, 0.2); border: 2px solid #ff4444; }
    .score { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
    .score.low { color: #14b8a6; }
    .score.medium { color: #ffaa00; }
    .score.high, .score.critical { color: #ff4444; }
    .level { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9; margin-top: 4px; }
    .threat { font-size: 12px; color: #8892b0; margin-top: 8px; }
    .button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #233554; background: transparent; color: #e6f1ff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .button:hover { background: #147b73; border-color: #147b73; }
    .footer { padding: 10px 16px; border-top: 1px solid #1e2c33; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #8892b0; }
    .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .loading { text-align: center; padding: 30px 10px; color: #8892b0; }
    .error { padding: 12px; background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; border-radius: 6px; font-size: 11px; color: #ff9999; }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🛡️</span>
    <span class="brand">CyberShield <small>AI</small></span>
  </div>
  <div class="content" id="content"><div class="loading">Scanning…</div></div>
  <div class="footer">
    <label class="toggle"><input type="checkbox" id="autoScan" checked> Auto-scan pages</label>
    <span>v1.0.0</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
